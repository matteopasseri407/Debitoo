services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-debitoo}
      MYSQL_USER: debitoo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-debitoo_local_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-debitoo_root_local_only}
    volumes:
      - debitoo_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      start_period: 30s
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-development-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost,testserver}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-debitoo}
      MYSQL_USER: debitoo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-debitoo_local_only}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/pratiche/', timeout=2)"]
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

volumes:
  debitoo_mysql_data:
